name: CI

on:
  push:
    branches: [ main, product-mvp ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies & package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install build wheel

    - name: Run unit & regression test suite (28 tests)
      run: |
        python -m unittest discover -s . -p "test_*.py"

    - name: Test CLI invocation
      run: |
        sandbox-comparator --help
        sandbox-comparator compare --report-a data/report_format_a_cape.json --report-b data/report_format_b_falcon.json

    - name: Verify package distribution build
      run: |
        python -m build --wheel

  rust-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Run Rust tests & CLI verification
      run: |
        cd rust
        cargo test --verbose
        cargo build --release
        ./target/release/sandbox-comparator --report-a ../data/report_format_a_cape.json --report-b ../data/report_format_b_falcon.json

